<!DOCTYPE html>
<html lang="zh-CN" data-state="active">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: transparent;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 6px 8px 12px;
      -webkit-app-region: drag;
      font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .indicator {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; height: 38px; padding: 0 18px;
      color: #f3f4f6;
      background: #23262b;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18), 0 6px 12px -6px rgba(0, 0, 0, 0.28);
      font-size: 13px; font-weight: 600; line-height: 1;
      white-space: nowrap;
      opacity: 1; transform: translateY(0);
      transition: opacity 120ms ease, transform 120ms ease;
      -webkit-app-region: drag;
      cursor: grab;
      user-select: none;
    }
    .indicator.offline .label { opacity: .65; }
    .indicator.offline .dot { animation: none; opacity: .35; }
    .dots { display: flex; align-items: center; gap: 3px; }
    .dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: #a8b3c4;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 120ms; }
    .dot:nth-child(3) { animation-delay: 240ms; }
    html[data-state="leaving"] .indicator { opacity: 0; transform: translateY(-6px); }
    @keyframes pulse {
      0%, 70%, 100% { opacity: .35; transform: scale(.8); }
      35% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .indicator, .dot { animation: none; transition: opacity 1ms linear; transform: none; }
      html[data-state="leaving"] .indicator { transform: none; }
    }
  </style>
</head>
<body>
  <div class="indicator" id="ind" role="status" aria-live="polite">
    <span class="dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
    <span id="label" class="label">Arena 正在操作电脑</span>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const ind = document.getElementById('ind');
    const label = document.getElementById('label');
    ipcRenderer.on('page-state', (e, s) => {
      document.documentElement.dataset.state = s;
    });
    ipcRenderer.on('copy', (e, s) => {
      label.textContent = s;
      ind.classList.remove('offline');
    });
    ipcRenderer.on('offline', () => {
      ind.classList.add('offline');
      label.textContent = 'Arena 已离线';
    });
  </script>
</body>
</html>
